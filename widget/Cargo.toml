[package]
name = "iced_widget"
description = "The built-in widgets for iced"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
image = ["iced_renderer/image"]
svg = ["iced_renderer/svg"]
canvas = ["iced_renderer/geometry"]
qr_code = ["canvas", "dep:qrcode"]
wgpu = ["iced_renderer/wgpu-bare"]
markdown = ["dep:pulldown-cmark"]
highlighter = ["dep:iced_highlighter"]
advanced = []

[dependencies]
iced_renderer.workspace = true
iced_runtime.workspace = true

num-traits.workspace = true
log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true

qrcode.workspace = true
qrcode.optional = true

pulldown-cmark.workspace = true
pulldown-cmark.optional = true

iced_highlighter.workspace = true
iced_highlighter.optional = true

[dev-dependencies]
# enzUI-ICED #1802: the drag-coalescing test drives `UserInterface::update`
# on a real `text_editor` inside a `scrollable`, which needs a `text::Renderer`
# implementation. The software backend is enough (no GPU probing, no wgpu
# feature gate on top-level `iced`), and it keeps the test's cold build
# small enough for the admitted <=40s ceiling.
#
# `iced_tiny_skia` transitively depends on `softbuffer`, whose backend
# dispatch enum has zero variants until AT LEAST one platform feature is
# enabled -- otherwise it fails to build with E0004/E0282/E0283/E0392. The
# workspace dep sets `default-features = false`; re-enable `x11` here so
# the test can compile on this Linux host. No window is created.
iced_tiny_skia = { workspace = true, features = ["x11"] }
iced_test.workspace = true

iced_renderer.workspace = true
iced_renderer.features = ["tiny-skia", "x11", "wayland"]

iced_widget.workspace = true
iced_widget.features = ["markdown"]
