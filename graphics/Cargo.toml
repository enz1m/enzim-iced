[package]
name = "iced_graphics"
description = "A bunch of backend-agnostic types that can be leveraged to build a renderer for iced"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
geometry = ["lyon_path"]
image = ["dep:image", "kamadak-exif"]
svg = []
web-colors = []
fira-sans = []

[dependencies]
iced_core.workspace = true
iced_futures.workspace = true

bitflags.workspace = true
bytemuck.workspace = true
cosmic-text.workspace = true
half.workspace = true
log.workspace = true
raw-window-handle.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
# enzICED: grapheme positions for our text_input (upstream dropped it with #3404).
unicode-segmentation.workspace = true

image.workspace = true
image.optional = true

kamadak-exif.workspace = true
kamadak-exif.optional = true

lyon_path.workspace = true
lyon_path.optional = true

# enzUI-ICED #1809: the cosmic-text dirty/shaping counters exist only for this
# crate's own regression tests. Declaring the feature as a DEV dependency (the
# workspace resolver keeps dev-dependency features out of a normal build) means
# a product build of `iced_graphics` links the stub counters, which are
# `const fn` no-ops. The `_1809` gates fail loudly if the feature is missing:
# they assert the conservative path still reports non-zero work.
[dev-dependencies]
cosmic-text = { workspace = true, features = ["instrumentation"] }
